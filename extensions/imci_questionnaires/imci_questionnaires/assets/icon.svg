<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- IMCI Questionnaires icon: thermometer (fever pathway) -->

  <!-- Background tile -->
  <rect x="0" y="0" width="100" height="100" rx="14" fill="#fdf6ec" />

  <!-- Thermometer stem (rounded rectangle) -->
  <rect x="44" y="14" width="12" height="58" rx="6" fill="#4a5568" />

  <!-- Mercury column inside stem -->
  <rect x="47" y="20" width="6" height="50" rx="3" fill="#c53030" />

  <!-- Thermometer bulb -->
  <circle cx="50" cy="80" r="11" fill="#c53030" />

  <!-- Tick marks on the right side of stem -->
  <rect x="58" y="24" width="6" height="2" fill="#4a5568" />
  <rect x="58" y="34" width="6" height="2" fill="#4a5568" />
  <rect x="58" y="44" width="6" height="2" fill="#4a5568" />
  <rect x="58" y="54" width="6" height="2" fill="#4a5568" />
</svg>
