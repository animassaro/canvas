name: IMCI Fever Common Assessment
form_type: QUES
code_system: INTERNAL
code: IMCI_FEVER_COMMON
can_originate_in_charting: true
prologue: |
  Common assessment for any child with fever — duration, measles history,
  examination findings, and the clinic's malaria-risk context.
questions:
  - content: "Duration of fever"
    code_system: INTERNAL
    code: IMCI_FC_DURATION
    responses_code_system: INTERNAL
    responses_type: SING
    responses:
      - name: "Less than 7 days"
        code: IMCI_FC_DURATION_LT7
        value: "0"
      - name: "7 days or more"
        code: IMCI_FC_DURATION_GE7
        value: "1"

  - content: "If 7 days or more, has the child had fever every day?"
    code_system: INTERNAL
    code: IMCI_FC_DAILY
    responses_code_system: INTERNAL
    responses_type: SING
    enabled_conditions:
      - question_code: IMCI_FC_DURATION
        operator: "="
        value_code: IMCI_FC_DURATION_GE7
    responses:
      - name: "Yes"
        code: IMCI_FC_DAILY_YES
        value: "1"
      - name: "No"
        code: IMCI_FC_DAILY_NO
        value: "0"

  - content: "Has the child had measles in the last 3 months (or has measles now)?"
    code_system: INTERNAL
    code: IMCI_FC_MEASLES
    responses_code_system: INTERNAL
    responses_type: SING
    responses:
      - name: "Yes"
        code: IMCI_FC_MEASLES_YES
        value: "1"
      - name: "No"
        code: IMCI_FC_MEASLES_NO
        value: "0"

  - content: "On exam: stiff neck?"
    code_system: INTERNAL
    code: IMCI_FC_STIFF_NECK
    responses_code_system: INTERNAL
    responses_type: SING
    responses:
      - name: "Yes"
        code: IMCI_FC_STIFF_NECK_YES
        value: "1"
      - name: "No"
        code: IMCI_FC_STIFF_NECK_NO
        value: "0"

  - content: "Any general danger sign? (unable to drink or breastfeed, vomits everything, convulsions, lethargic or unconscious)"
    code_system: INTERNAL
    code: IMCI_FC_DANGER
    responses_code_system: INTERNAL
    responses_type: SING
    responses:
      - name: "Yes"
        code: IMCI_FC_DANGER_YES
        value: "1"
      - name: "No"
        code: IMCI_FC_DANGER_NO
        value: "0"

  - content: "Apparent cause of fever other than malaria? (pneumonia, ear or throat infection, skin, etc.)"
    code_system: INTERNAL
    code: IMCI_FC_OTHER_CAUSE
    responses_code_system: INTERNAL
    responses_type: SING
    responses:
      - name: "Yes"
        code: IMCI_FC_OTHER_CAUSE_YES
        value: "1"
      - name: "No"
        code: IMCI_FC_OTHER_CAUSE_NO
        value: "0"

  - content: "Malaria-risk level of this clinic's catchment area"
    code_system: INTERNAL
    code: IMCI_FC_MALARIA_RISK
    responses_code_system: INTERNAL
    responses_type: SING
    responses:
      - name: "High"
        code: IMCI_FC_MALARIA_RISK_HIGH
        value: "2"
      - name: "Low"
        code: IMCI_FC_MALARIA_RISK_LOW
        value: "1"
      - name: "None"
        code: IMCI_FC_MALARIA_RISK_NONE
        value: "0"

  - content: "If no local risk, recent travel to a malaria-risk area?"
    code_system: INTERNAL
    code: IMCI_FC_TRAVEL
    responses_code_system: INTERNAL
    responses_type: SING
    enabled_conditions:
      - question_code: IMCI_FC_MALARIA_RISK
        operator: "="
        value_code: IMCI_FC_MALARIA_RISK_NONE
    responses:
      - name: "Yes"
        code: IMCI_FC_TRAVEL_YES
        value: "1"
      - name: "No"
        code: IMCI_FC_TRAVEL_NO
        value: "0"
